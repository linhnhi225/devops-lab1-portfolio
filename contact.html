<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liên hệ | DevOps Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
            margin-bottom: 20px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 32px;
        }

        h2 {
            color: #764ba2;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: normal;
        }

        .nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 24px 0;
        }

        .nav a {
            text-decoration: none;
            color: #667eea;
            border: 1px solid #667eea;
            padding: 8px 14px;
            border-radius: 20px;
            transition: 0.3s;
        }

        .nav a:hover,
        .nav a.active {
            background: #667eea;
            color: white;
        }

        .info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 24px;
            margin: 20px 0;
            text-align: left;
            line-height: 1.8;
        }

        .info p {
            margin: 14px 0;
            overflow-wrap: anywhere;
        }

        .contact-link {
            color: #667eea;
            text-decoration: none;
        }

        .contact-link:hover {
            text-decoration: underline;
        }

        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            margin: 4px;
        }

        .footer {
            margin-top: 24px;
            font-size: 13px;
            color: #999;
            line-height: 1.8;
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 18px;
            }

            .avatar {
                width: 125px;
                height: 125px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <img
            src="images/avatar.jpg"
            alt="Ảnh đại diện"
            class="avatar"
        >

        <h1>Contact Me</h1>
        <h2>Thông tin liên hệ </h2>

        <nav class="nav">
            <a href="index.html">Trang chủ</a>
            <a href="about.html">Giới thiệu</a>
            <a href="contact.html" class="active">Liên hệ</a>
        </nav>

        <section class="info">
            <p>
                <strong>Họ và tên:</strong>
                Mậu Thị Linh Nhi
            </p>

            <p>
                <strong>Email:</strong>
                <a class="contact-link"
                   href="mailto:dtc235190012@ictu.edu.vn">
                    dtc235190012@ictu.edu.vn
                </a>
            </p>

            <p>
                <strong>GitHub:</strong>
                <a class="contact-link"
                   href="https://github.com/linhnhi225"
                   target="_blank"
                   rel="noopener noreferrer">
                    github.com/linhnhi225
                </a>
            </p>
        </section>

        <div>
            <span class="badge">GitHub</span>
            <span class="badge">DevOps</span>
            <span class="badge">CI/CD</span>
        </div>

        <div class="footer">
            <p>DevOps Lab 1 — My Portfolio</p>
            <p>Push Code → CI Pipeline → Auto Deploy</p>
        </div>

    </main>
</body>
</html>
